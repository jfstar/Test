spring:
  application:
    name: microservicio-cuentas
  # Perfil por defecto: H2 en memoria. Permite compilar, arrancar y probar
  # el microservicio sin depender de una instancia de SQL Server disponible.
  # El perfil "sqlserver" (application-sqlserver.yml) conecta contra la BD
  # real usando variables de entorno (ver Tarea 2 / README).
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # circuitbreakers/circuitbreakerevents: permiten ver el estado
        # (CLOSED/OPEN/HALF_OPEN) y el historial de eventos del circuit
        # breaker de la Tarea 3 sin instrumentacion adicional.
        # prometheus (Tarea 5): expone /actuator/prometheus para que un
        # servidor Prometheus haga scraping de las metricas de Micrometer.
        include: health,info,metrics,circuitbreakers,circuitbreakerevents,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      # Etiqueta comun en toda metrica exportada; util cuando un mismo
      # Prometheus/Grafana observa varios microservicios a la vez.
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # Genera los buckets de histograma que Prometheus necesita para
        # calcular percentiles (p95/p99) de latencia HTTP en el servidor,
        # en vez de solo un promedio -- clave para el runbook (Tarea 5).
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.pruebatecnica.accounts: DEBUG

# Cliente hacia el servicio externo de validacion (Tarea 3). Sin URL propia
# por defecto no hay tercero corriendo en localhost:8081, por lo que
# arrancar el microservicio "tal cual" ya demuestra el camino de "tercero
# caido" (ver README); levantar el stub de third-party-stub/ demuestra el
# camino feliz.
app:
  validation:
    base-url: ${VALIDATION_SERVICE_URL:http://localhost:8081}
    connect-timeout-ms: ${VALIDATION_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${VALIDATION_READ_TIMEOUT_MS:2000}

resilience4j:
  circuitbreaker:
    instances:
      validationService:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      validationService:
        maxAttempts: 3
        waitDuration: 300ms
        # Solo se reintentan fallas de comunicacion (timeout, conexion
        # rechazada, 5xx). Un rechazo de negocio del tercero (aprobado=false
        # con HTTP 200) nunca llega como excepcion, asi que nunca se
        # reintenta ni cuenta como falla del circuit breaker.
        retryExceptions:
          - com.pruebatecnica.accounts.adapter.validation.ValidationServiceException
  bulkhead:
    instances:
      validationService:
        maxConcurrentCalls: 10
        maxWaitDuration: 0

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:cuentasdb;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: sqlserver
  datasource:
    # Ninguna credencial se escribe en el codigo: todo llega por variables de
    # entorno (ver Dockerfile / docker-compose / README). En este perfil el
    # esquema NO lo crea Hibernate: se aplica antes con los scripts de la
    # Tarea 2 (schema.sql), por eso ddl-auto=validate.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.SQLServerDialect
