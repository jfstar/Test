# Configuracion de Prometheus
# Hace scraping del endpoint /actuator/prometheus del microservicio, que
# Micrometer expone en formato Prometheus (ver
# microservicio-cuentas/src/main/resources/application.yml).

global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "microservicio-cuentas"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["app:8080"]
        labels:
          service: "microservicio-cuentas"
